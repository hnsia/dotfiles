# ---- General ----------------------------------------------------------------
set -g history-limit 50000     # generous scrollback; captured on save
set -g mouse on                # scroll / select panes / resize with the mouse
set -sg escape-time 10         # no Esc lag in Neovim
set -g focus-events on         # let editors react to focus changes
setw -g mode-keys vi           # vi-style keys in copy mode
set -g base-index 1            # windows start at 1
setw -g pane-base-index 1

# Prefix is left at the default C-b on purpose, to avoid keybinding conflicts.
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---- Plugins (managed by TPM) ----------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect: what to capture when saving.
set -g @resurrect-capture-pane-contents 'on'  # persist each pane's scrollback
set -g @resurrect-strategy-nvim 'session'      # restore Neovim session state

# tmux-continuum: automatic save + restore.
set -g @continuum-restore 'on'           # restore last env when tmux first starts
set -g @continuum-save-interval '5'       # minutes between automatic saves

# Initialize TPM — keep this line at the very bottom of the file.
run '~/.tmux/plugins/tpm/tpm'
